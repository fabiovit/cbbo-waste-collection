name: Release consistency

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check tag and manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("custom_components/cbbo_waste_collection/manifest.json"))["version"])')"

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=""
          fi

          echo "Manifest version: ${MANIFEST_VERSION}"

          if [[ -n "${TAG}" ]]; then
            EXPECTED="v${MANIFEST_VERSION}"
            echo "Git tag/release: ${TAG}"
            if [[ "${TAG}" != "${EXPECTED}" ]]; then
              echo "::error::Tag ${TAG} does not match manifest version ${MANIFEST_VERSION} (expected ${EXPECTED})"
              exit 1
            fi
          fi
